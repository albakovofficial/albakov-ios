# Аудит приложения в симуляторе iPhone (только ручной запуск; на TestFlight и App Store не влияет).
# 1) UI-тесты покупки (audit/AuditUITests.swift): приложение Debug ходит в копию магазина на этом же Mac
#    (albakov-shop с тестовыми товарами) через посредника ci/audit-proxy.js, который умеет рвать связь,
#    замедлять её и отвечать 502. Боевой сайт и настоящие заказы не затрагиваются.
# 2) Снимки экранов с боевыми товарами (только чтение; всё, что меняет данные, в демо-режиме не уходит):
#    маленький, обычный и большой iPhone, крупный системный шрифт, тёмная тема, запуск без интернета.
# Результат — ветка audit-shots этого репозитория: снимки, итоги тестов, журналы.
name: Аудит (симулятор)

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'UI-тесты покупки на копии магазина'
        type: boolean
        default: true
      shots:
        description: 'Снимки: разные iPhone, крупный шрифт, тёмная тема, без интернета'
        type: boolean
        default: true
      full_shots:
        description: 'Все экраны на маленьком и обычном iPhone (долго)'
        type: boolean
        default: false
      only:
        description: 'Только эти тесты через пробел, например test03_CheckoutValidationAndDoubleTap (пусто — все)'
        type: string
        default: ''
      runner:
        description: 'Mac на GitHub'
        type: choice
        options: [macos-15-intel, macos-26, macos-15]
        default: macos-15-intel
      tsan:
        description: 'Thread Sanitizer: приложение и тесты собираются с поиском гонок данных, отчёты — в tsan/ (медленнее; только проверка)'
        type: boolean
        default: false

concurrency:
  group: audit
  cancel-in-progress: true

jobs:
  audit:
    name: Аудит в симуляторе
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Копия магазина закреплена на коммите (этап H, T-5): изменение сайта не меняет итог тестов приложения без ведома.
      # Сейчас — 13.65.6 (main на 16.11.2026), с ним прошли полные прогоны этапов E–G.
      # Обновлять так: взять новый SHA из albakov-shop (git log -1 main), прогнать здесь все тесты вручную с этим SHA
      # (поле ref ниже), и только если всё прошло — записать его сюда вместе с версией сайта в комментарии.
      - name: Копия магазина (albakov-shop)
        uses: actions/checkout@v4
        with:
          repository: albakovofficial/albakov-shop
          ref: 1fe8b8842bc9af0be0ea6b2f5c1afacdd47a5456
          # albakov-shop закрытый: нужен секрет SHOP_TOKEN (токен только на чтение этого репозитория, вводит владелец).
          # Без секрета — токен задачи: его хватает, только пока albakov-shop открыт
          token: ${{ secrets.SHOP_TOKEN || github.token }}
          path: shop

      - name: Выбрать Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Проект с целью аудита (project.yml не меняется)
        run: |
          brew install xcodegen
          ruby -ryaml -e '
            s = YAML.load_file("project.yml")
            s["targets"]["AlbakovAudit"] = {
              "type" => "bundle.ui-testing", "platform" => "iOS",
              "sources" => [{ "path" => "audit" }],
              "dependencies" => [{ "target" => "Albakov" }],
              "settings" => { "base" => { "PRODUCT_BUNDLE_IDENTIFIER" => "ru.albakovofficial.audit", "GENERATE_INFOPLIST_FILE" => "YES",
                                          "TEST_TARGET_NAME" => "Albakov", "SWIFT_VERSION" => "5.0" } } }
            # юнит-тесты этапа A (audit-unit/): ключ повтора заказа, ключи строк панели, фото поддержки
            s["targets"]["AlbakovUnit"] = {
              "type" => "bundle.unit-test", "platform" => "iOS",
              "sources" => [{ "path" => "audit-unit" }],
              "dependencies" => [{ "target" => "Albakov" }],
              "settings" => { "base" => { "PRODUCT_BUNDLE_IDENTIFIER" => "ru.albakovofficial.unit", "GENERATE_INFOPLIST_FILE" => "YES",
                                          "TEST_HOST" => "$(BUILT_PRODUCTS_DIR)/Albakov.app/Albakov", "BUNDLE_LOADER" => "$(TEST_HOST)",
                                          "SWIFT_VERSION" => "5.0" } } }
            s["schemes"] = { "AlbakovAudit" => { "build" => { "targets" => { "Albakov" => "all", "AlbakovAudit" => ["test"], "AlbakovUnit" => ["test"] } },
                                                  "test" => { "config" => "Debug", "targets" => ["AlbakovUnit", "AlbakovAudit"] } } }
            File.write("audit-project.yml", s.to_yaml)'
          xcodegen generate --spec audit-project.yml

      - name: Симуляторы
        run: |
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys, re
          want = sys.argv[1]
          d = json.load(sys.stdin)["devices"]
          xs = [x for k, v in d.items() if "iOS" in k for x in v]
          f = lambda p: next((x["udid"] for x in xs if p(x["name"])), "")
          if want == "small": print(f(lambda n: "SE" in n) or f(lambda n: "16e" in n) or f(lambda n: "mini" in n))
          elif want == "max": print(f(lambda n: "Pro Max" in n) or f(lambda n: "Plus" in n))
          else: print(f(lambda n: re.fullmatch(r"iPhone \d+", n) is not None) or f(lambda n: "Pro" in n and "Max" not in n))' "$1"
          }
          SMALL=$(pick small)
          if [ -z "$SMALL" ]; then SMALL=$(xcrun simctl create "Аудит SE" com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation 2>/dev/null || true); fi
          if [ -z "$SMALL" ]; then SMALL=$(pick std); fi
          STD=$(pick std); MAX=$(pick max)
          echo "SMALL=$SMALL" >> "$GITHUB_ENV"; echo "STD=$STD" >> "$GITHUB_ENV"; echo "MAX=$MAX" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep -E "$SMALL|$STD|$MAX"

      - name: Собрать приложение и тесты
        env:
          TSAN: ${{ inputs.tsan }}
        run: |
          set -o pipefail
          # тесты ходят в копию магазина на этом Mac (адрес меняется только в рабочей копии на GitHub)
          plutil -replace AlbakovBaseURL -string "http://127.0.0.1:3998" Albakov/Resources/Info.plist
          plutil -replace NSAppTransportSecurity -json '{"NSAllowsArbitraryLoads":true}' Albakov/Resources/Info.plist
          # тестовый раннер в симуляторе Xcode 26 должен быть подписан — подпись «для себя» (без профиля)
          SAN=""; [ "$TSAN" = true ] && SAN="-enableThreadSanitizer YES"
          xcodebuild build-for-testing -project Albakov.xcodeproj -scheme AlbakovAudit -configuration Debug $SAN \
            -destination "id=$SMALL" -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee build.log | grep -E "error:|TEST BUILD (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" || true
          grep -qE "TEST BUILD SUCCEEDED|BUILD SUCCEEDED" build.log
          # копия для снимков — с боевым адресом магазина, заново подписанная
          APP=build/Build/Products/Debug-iphonesimulator/Albakov.app
          cp -R "$APP" "$RUNNER_TEMP/Albakov-prod.app"
          plutil -replace AlbakovBaseURL -string "https://albakovofficial.ru" "$RUNNER_TEMP/Albakov-prod.app/Info.plist"
          plutil -remove NSAppTransportSecurity "$RUNNER_TEMP/Albakov-prod.app/Info.plist"
          codesign --force --sign - --preserve-metadata=entitlements "$RUNNER_TEMP/Albakov-prod.app"
          plutil -p "$APP/Info.plist" | grep -E "AlbakovBaseURL|NSAllows"; codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier" || true

      - name: Копия магазина и посредник
        if: inputs.tests
        run: |
          start() { (cd shop && PORT=3999 PUBLIC_URL=http://127.0.0.1:3998 OWNER_PHONE=79070009999 nohup node server.js >> ../server.log 2>&1 &); sleep 4; }
          start
          # владелец панели для проверок этапа A (почта в копии не настроена — регистрация и вход без кода);
          # пароль из цифр: язык симулятора русский, и в секретном поле латинские буквы не набираются (этап A.1)
          # владелец назначается при запуске магазина, поэтому после регистрации магазин перезапускается
          curl -s -X POST http://127.0.0.1:3999/api/auth/register -H 'Content-Type: application/json' \
            -d '{"firstName":"Аудит","lastName":"Владелец","phone":"79070009999","email":"owner-audit@example.com","password":"5739146280","consent":true}' | head -c 120; echo
          sleep 2; pkill -f "node server.js" || true; sleep 2
          start
          grep -E "Владелец панели" server.log || true
          (nohup node ci/audit-proxy.js 3998 3999 > proxy.log 2>&1 &)
          sleep 2
          curl -s http://127.0.0.1:3998/api/state | head -c 160; echo

      - name: Пять больших фото (≈48 Мп) в «Фото» симулятора — для проверки памяти (этап A, IOS-03)
        if: inputs.tests
        run: |
          xcrun simctl boot "$SMALL" 2>/dev/null || true; xcrun simctl bootstatus "$SMALL" -b >/dev/null || true
          mkdir -p "$RUNNER_TEMP/big"
          for i in 1 2 3 4 5; do
            sips -s format jpeg -s formatOptions 90 -z $((6048 - i * 8)) $((8064 - i * 8)) Albakov/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png --out "$RUNNER_TEMP/big/big$i.jpg" >/dev/null
          done
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP"/big/*.jpg | grep -E "pixel" | head -4
          xcrun simctl addmedia "$SMALL" "$RUNNER_TEMP"/big/*.jpg

      # Шаг падает, если xcodebuild завершился с ошибкой (этап H, T-1). Журналы и снимки при этом сохраняются: следующие шаги
      # идут при !cancelled(), сохранение — always(). Итог проверяется ещё раз по xcresult последним шагом
      - name: UI-тесты покупки
        if: inputs.tests
        timeout-minutes: 80   # 16 UI-тестов с этапа B идут ~45 мин на Intel-Mac — 50 минут впритык
        env:
          ONLY: ${{ inputs.only }}
          TSAN: ${{ inputs.tsan }}
        run: |
          RUN=$(ls build/Build/Products/*.xctestrun | head -1)
          # Thread Sanitizer: отчёты процессов в симуляторе (приложение под UI-тестами и хост юнит-тестов) — в файлы на этом Mac
          SAN=""; if [ "$TSAN" = true ]; then SAN="-enableThreadSanitizer YES"; mkdir -p "$RUNNER_TEMP/tsan"; export SIMCTL_CHILD_TSAN_OPTIONS="log_path=$RUNNER_TEMP/tsan/report halt_on_error=0"; export TEST_RUNNER_TSAN_OPTIONS="$SIMCTL_CHILD_TSAN_OPTIONS"; fi
          # память приложения (RSS, КБ) раз в полсекунды — пик между отметками MEMMARK из тестов (этап A, IOS-03)
          ( while true; do P=$(pgrep -f "Albakov\.app/Albakov( |$)" | head -1); [ -n "$P" ] && echo "$(date +%s) $(ps -o rss= -p "$P" | tr -d ' ')"; sleep 0.5; done > mem.log 2>/dev/null & )
          # «unit» — все юнит-тесты; иначе имя UI-теста
          SEL=""; for t in $ONLY; do if [ "$t" = unit ]; then SEL="$SEL -only-testing:AlbakovUnit"; else SEL="$SEL -only-testing:AlbakovAudit/AuditUITests/$t"; fi; done
          set +e
          xcodebuild test-without-building -xctestrun "$RUN" -destination "id=$SMALL" -resultBundlePath audit.xcresult $SAN $SEL 2>&1 | tee test.log | grep -E "Test Case|error:|XCTAssert|Executed|ThreadSanitizer"
          code=${PIPESTATUS[0]}
          echo "xcodebuild test-without-building: код завершения $code"
          exit $code

      - name: Итоги тестов и снимки из них
        if: ${{ !cancelled() && inputs.tests }}
        continue-on-error: true
        run: |
          mkdir -p out/tests
          xcrun xcresulttool get test-results tests --path audit.xcresult > out/tests.json || true
          xcrun xcresulttool get test-results summary --path audit.xcresult > out/summary.json || true
          xcrun xcresulttool export attachments --path audit.xcresult --output-path out/tests || true
          python3 - <<'PY'
          import json, os, re
          m = os.path.join('out/tests', 'manifest.json')
          if os.path.exists(m):
              for t in json.load(open(m)):
                  test = re.sub(r'\W+', '_', t.get('testIdentifier', 'test'))[-60:]
                  for a in t.get('attachments', []):
                      src = os.path.join('out/tests', a['exportedFileName'])
                      name = re.sub(r'[/\\:]+', '-', a.get('suggestedHumanReadableName', a['exportedFileName']))
                      if os.path.exists(src): os.rename(src, os.path.join('out/tests', test + '__' + name))
          PY
          cp test.log server.log proxy.log mem.log out/ 2>/dev/null || true
          if [ -d "$RUNNER_TEMP/tsan" ]; then mkdir -p out/tsan; cp "$RUNNER_TEMP"/tsan/* out/tsan/ 2>/dev/null || true; ls out/tsan | wc -l | xargs echo "отчётов Thread Sanitizer:"; fi
          python3 - <<'PY' > out/mem-summary.txt || true
          import re
          marks = [(m.group(1), int(m.group(2))) for m in re.finditer(r"MEMMARK (\S+) (\d+)", open('test.log', errors='ignore').read())]
          seen = {}
          for k, t in marks: seen.setdefault(k, t)
          mem = [tuple(map(int, l.split())) for l in open('mem.log') if len(l.split()) == 2]
          def at(t): return next((kb for ts, kb in reversed(mem) if ts <= t), 0) / 1024
          def peak(a, b): return max([kb for ts, kb in mem if a <= ts <= b] or [0]) / 1024
          print('Память приложения (RSS, МБ) в тесте 13 — пять фото ~48 Мп')
          if all(k in seen for k in ('photos-start', 'photos-loaded', 'photos-removed', 'sheet-closed')):
              s, l, r, c = (seen[k] for k in ('photos-start', 'photos-loaded', 'photos-removed', 'sheet-closed'))
              print('до выбора фото:        %.0f' % at(s))
              print('пик при загрузке 5 фото: %.0f' % peak(s, l))
              print('5 фото в обращении:     %.0f' % at(l))
              print('после «Убрать фото»:    %.0f' % at(r))
              print('после закрытия окна:    %.0f' % at(c + 3))
          else:
              print('отметки не найдены:', seen)
          print('максимум за все тесты:  %.0f' % (max([kb for _, kb in mem] or [0]) / 1024))
          PY
          cat out/mem-summary.txt
          ls out/tests | head -80

      - name: Снимки экранов (боевые товары, только чтение)
        if: ${{ !cancelled() && inputs.shots }}
        continue-on-error: true
        timeout-minutes: 45
        env:
          FULL: ${{ inputs.full_shots }}
        run: |
          PROD="$RUNNER_TEMP/Albakov-prod.app"
          to() { local t=$1; shift; perl -e 'alarm shift; exec @ARGV' "$t" "$@"; }   # команда симулятора не дольше t секунд
          shoot() {  # папка udid экраны…
            local NAME=$1 UDID=$2; shift 2; mkdir -p "out/shots/$NAME"
            to 120 xcrun simctl boot "$UDID" 2>/dev/null || true; to 240 xcrun simctl bootstatus "$UDID" -b >/dev/null || true
            to 30 xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 2>/dev/null || true
            to 180 xcrun simctl install "$UDID" "$PROD" || echo "не установилось на $NAME"
            local i=0
            for S in "$@"; do
              i=$((i+1))
              to 60 xcrun simctl launch --terminate-running-process "$UDID" ru.albakovofficial.app -AppleLanguages "(ru)" -AppleLocale ru_RU -screen "$S" >/dev/null 2>&1 || echo "не запустилось: $NAME $S"
              sleep 15
              to 60 xcrun simctl io "$UDID" screenshot "out/shots/$NAME/$(printf %02d $i)$(echo "$S" | tr '/?=&' '____' | cut -c1-40).png" >/dev/null 2>&1 || echo "нет снимка: $NAME $S"
            done
          }
          BUYER=(/ /catalog "/catalog?cat=FIRSTCAT" /product/FIRST "/product/FIRST?sizes=1&demo=buyer" "/cart?demo=1" "/checkout?demo=1" /account "/account?demo=buyer" "/order/d1?demo=buyer" "/account?tab=bonus&demo=buyer" "/account?tab=support&id=t1&demo=buyer" /gift /track /menu /favorites)
          KEY=(/ /product/FIRST "/cart?demo=1" "/checkout?demo=1" "/order/d1?demo=buyer" "/account?demo=buyer" /gift)
          if [ "$FULL" = "true" ]; then shoot 1-small "$SMALL" "${BUYER[@]}"; shoot 2-standard "$STD" "${BUYER[@]}"; fi
          to 120 xcrun simctl shutdown "$SMALL" || true
          if [ "$FULL" = "true" ]; then shoot 3-promax "$MAX" "${KEY[@]}"; to 120 xcrun simctl shutdown "$MAX" || true; fi
          to 120 xcrun simctl boot "$SMALL" || true; to 240 xcrun simctl bootstatus "$SMALL" -b >/dev/null || true
          xcrun simctl ui "$SMALL" content_size accessibility-extra-extra-extra-large || true
          shoot 4-small-huge-text "$SMALL" "${KEY[@]}"
          xcrun simctl ui "$SMALL" content_size large || true; to 120 xcrun simctl shutdown "$SMALL" || true
          to 120 xcrun simctl boot "$STD" || true; to 240 xcrun simctl bootstatus "$STD" -b >/dev/null || true
          xcrun simctl ui "$STD" content_size extra-extra-extra-large || true
          shoot 5-standard-xxxl-text "$STD" "${KEY[@]}"
          xcrun simctl ui "$STD" content_size large || true
          xcrun simctl ui "$STD" appearance dark || true
          shoot 6-standard-dark "$STD" "${KEY[@]}"
          xcrun simctl ui "$STD" appearance light || true
          # без интернета: адрес магазина ведёт в никуда
          echo "127.0.0.1 albakovofficial.ru" | sudo tee -a /etc/hosts >/dev/null; sudo dscacheutil -flushcache || true; sudo killall -HUP mDNSResponder || true
          shoot 7-offline "$STD" / /product/FIRST /cart "/order/d1"
          sudo sed -i '' '/albakovofficial.ru/d' /etc/hosts || true; sudo dscacheutil -flushcache || true; sudo killall -HUP mDNSResponder || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i albakov > out/crashes.txt || echo "сбоев приложения нет" > out/crashes.txt
          cat out/crashes.txt

      - name: Сохранить в ветку audit-shots
        if: always()
        run: |
          mkdir -p out && cd out
          find . -name "*.png" -exec sips -Z 1200 {} \; >/dev/null 2>&1 || true
          git init -q && git checkout -q -b audit-shots
          git -c user.name=ci -c user.email=ci@albakovofficial.ru add . && git -c user.name=ci -c user.email=ci@albakovofficial.ru commit -qm "Аудит ${{ github.sha }}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" audit-shots

      # Последний шаг (этап H, T-1): итог задачи — по xcresult, а не по поиску слов в журнале. Ошибка, если итогов нет
      # (сборка или xcodebuild упали до тестов), не выполнилось ни одного теста, есть упавшие или пропущенные тесты
      # (XCTSkip в тестах нет — пропуск всегда неожиданный), общий итог не Passed или тест, названный в «only»,
      # не выполнен и не прошёл (опечатка в имени). Идёт после сохранения в audit-shots — журналы уже сохранены
      - name: Проверка итогов тестов
        if: ${{ !cancelled() && inputs.tests }}
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = 'out/summary.json'
          if not os.path.exists(p) or os.path.getsize(p) == 0:
              print('::error::Нет итогов xcresult — тесты не запускались: сборка или xcodebuild упали раньше (см. шаги выше)'); sys.exit(1)
          try:
              j = json.load(open(p))
          except ValueError as e:
              print('::error::Итоги xcresult не читаются: %s' % e); sys.exit(1)
          total, passed, failed = j.get('totalTestCount', 0), j.get('passedTests', 0), j.get('failedTests', 0)
          skipped, result = j.get('skippedTests', 0), j.get('result', '')
          print('Итог xcresult: %s; всего %d, прошло %d, упало %d, пропущено %d' % (result, total, passed, failed, skipped))
          for f in j.get('testFailures', []):
              print('::error::%s: %s' % (f.get('testName', '?'), (f.get('failureText') or '')[:300]))
          # прошедшие UI-тесты по имени — из дерева tests.json
          ran = set()
          def walk(n):
              if n.get('nodeType') == 'Test Case' and n.get('result') == 'Passed': ran.add(n.get('name', '').split('(')[0])
              for c in n.get('children', []): walk(c)
          try:
              for n in json.load(open('out/tests.json')).get('testNodes', []): walk(n)
          except (OSError, ValueError) as e:
              print('::warning::Дерево тестов не читается: %s' % e)
          names = [t for t in os.environ.get('ONLY', '').split() if t != 'unit']
          problems = []
          if total == 0: problems.append('не выполнилось ни одного теста')
          if failed > 0: problems.append('упало тестов: %d' % failed)
          if skipped > 0: problems.append('пропущено тестов: %d' % skipped)
          if result != 'Passed': problems.append('общий итог %r вместо Passed' % result)
          for t in names:
              if t not in ran: problems.append('тест %s из «only» не выполнен или не прошёл — имя с ошибкой?' % t)
          if problems:
              for m in problems: print('::error::' + m)
              sys.exit(1)
          PY
