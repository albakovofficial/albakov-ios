# Сборка приложения ALBAKOV для iPhone на GitHub (Mac не нужен).
# 1) Каждый push в main и каждый pull request — проверочная сборка под симулятор, без подписи, и юнит-тесты (этап I).
# 2) Тег V1.0.1 (или v1.0.1) либо ручной запуск с галочкой «TestFlight» — подписанная сборка и выгрузка в App Store Connect.
#    Нужны секреты репозитория: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (см. README.md).
name: iOS

on:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Выгрузить сборку в TestFlight'
        type: boolean
        default: false
      screens:
        description: 'Снять экраны приложения в симуляторе (для проверки дизайна)'
        type: boolean
        default: false
      store:
        description: 'Снимки для App Store: экраны покупателя, полный размер iPhone Pro Max, раздел «Мужчинам»'
        type: boolean
        default: false
      store_paths:
        description: 'Снимки для App Store: только эти экраны через пробел (пусто — все)'
        type: string
        default: ''
      screen_paths:
        description: 'Проверка дизайна: только эти экраны через пробел (пусто — все)'
        type: string
        default: ''
      build:
        description: 'Номер сборки для TestFlight (пусто — номер запуска)'
        type: string
        default: ''
      runner:
        description: 'Mac на GitHub (по умолчанию Intel: Mac на Apple Silicon у GitHub часто в очереди)'
        type: choice
        options: [macos-15-intel, macos-26, macos-15]
        default: macos-15-intel
      release_check:
        description: 'Проверка релиза (этап F): сборка Release и архив без подписи App Store; ничего не выгружается, секреты не нужны'
        type: boolean
        default: false
      swift_check:
        description: 'Только проверка готовности к Swift 6 (проект и обычные сборки не меняются): complete — все предупреждения о конкурентности, swift6 — ошибки режима Swift 6'
        type: choice
        options: [none, complete, swift6]
        default: none

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Сборка (симулятор)
    # Для выгрузки в TestFlight отдельная проверочная сборка не нужна: архив и так всё собирает (и Mac на GitHub бывает в дефиците).
    if: ${{ !startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && (inputs.testflight || inputs.screens || inputs.store)) }}
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 50   # сборка ~10 мин и юнит-тесты (сборка с целями тестов ~10 мин) на Intel-Mac
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Создать проект Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Собрать
        env:
          CHECK: ${{ inputs.swift_check || 'none' }}
        run: |
          set -o pipefail
          # проверка Swift 6 — только флагом этой сборки, настройки проекта прежние
          case "$CHECK" in complete) EXTRA="SWIFT_STRICT_CONCURRENCY=complete";; swift6) EXTRA="SWIFT_VERSION=6";; *) EXTRA="";; esac
          xcodebuild build \
            -project Albakov.xcodeproj -scheme Albakov -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO $EXTRA 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          # в режиме Swift 6 ошибки ожидаемы — это и есть список для плана миграции (полный журнал — в артефактах запуска)
          if [ "$CHECK" != none ]; then echo "Проверка $CHECK: ошибок $(grep -c ' error:' build.log), предупреждений $(grep -c ' warning:' build.log)"; fi
          [ "$CHECK" = swift6 ] || grep -q "BUILD SUCCEEDED" build.log

      - name: Лог сборки
        if: failure() || (github.event_name == 'workflow_dispatch' && inputs.swift_check != '' && inputs.swift_check != 'none')
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      # Юнит-тесты (этап I, I-1) — те же цели и та же проверка итогов, что в audit.yml (ci/test-targets.rb, ci/check-tests.py);
      # project.yml не меняется. UI-тесты остаются в audit.yml: им нужна копия магазина и они идут 40+ минут.
      # Хост юнит-тестов — само приложение: адрес магазина ведёт в закрытый порт, чтобы тесты не обращались к боевому сайту
      # (тесты сети и витрины работают через подмену ответов в самих тестах)
      - name: Юнит-тесты
        id: unit
        if: ${{ (inputs.swift_check || 'none') == 'none' }}
        run: |
          set -o pipefail
          ruby ci/test-targets.rb
          xcodegen generate --spec audit-project.yml
          plutil -replace AlbakovBaseURL -string "https://127.0.0.1:9" Albakov/Resources/Info.plist
          SIM=$(xcrun simctl list devices available | grep -E "^ +iPhone" | head -1 | grep -oE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "Симулятор: $SIM"
          xcodebuild test -project Albakov.xcodeproj -scheme AlbakovAudit -configuration Debug -only-testing:AlbakovUnit/NoSuchTests \
            -destination "id=$SIM" -derivedDataPath unit-build -resultBundlePath unit.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee unit.log | grep -E "Test Case.*(passed|failed)|error:|Executed|TEST (SUCCEEDED|FAILED)"

      # Итог — по xcresult и тогда, когда xcodebuild завершился успешно: 0 выполненных тестов — тоже ошибка
      - name: Итоги юнит-тестов
        if: ${{ !cancelled() && (inputs.swift_check || 'none') == 'none' && steps.unit.conclusion != 'skipped' }}
        run: |
          mkdir -p unit-out; cp unit.log unit-out/ 2>/dev/null || true
          xcrun xcresulttool get test-results summary --path unit.xcresult > unit-out/summary.json || true
          xcrun xcresulttool get test-results tests --path unit.xcresult > unit-out/tests.json || true
          python3 ci/check-tests.py unit-out/summary.json unit-out/tests.json

      - name: Журнал и итоги юнит-тестов
        if: ${{ !cancelled() && (inputs.swift_check || 'none') == 'none' && steps.unit.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: unit-out

  release:
    # Проверка релизной сборки (этап F): Release для iPhone и архив Xcode — подпись «для себя» (ad-hoc, как в шаге
    # «Архив» TestFlight), без сертификатов App Store. Экспорта и выгрузки нет, секреты не используются.
    name: Release и архив (без выгрузки)
    if: github.event_name == 'workflow_dispatch' && inputs.release_check && !inputs.testflight
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Выбрать Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Создать проект Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Сборка Release для iPhone
        run: |
          set -o pipefail
          xcodebuild build -project Albakov.xcodeproj -scheme Albakov -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee release.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          echo "Release: ошибок $(grep -c ' error:' release.log), предупреждений $(grep -c ' warning:' release.log)"
          grep -q "BUILD SUCCEEDED" release.log
      - name: Архив Xcode
        run: |
          set -o pipefail
          xcodebuild archive -project Albakov.xcodeproj -scheme Albakov -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Albakov.xcarchive" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER="" DEVELOPMENT_TEAM="" \
            2>&1 | tee archive.log | grep -E "error:|warning:|ARCHIVE (SUCCEEDED|FAILED)" || true
          echo "Архив: ошибок $(grep -c ' error:' archive.log), предупреждений $(grep -c ' warning:' archive.log)"
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Контроль поиска строк — Debug для iPhone
        run: |
          set -o pipefail
          xcodebuild build -project Albakov.xcodeproj -scheme Albakov -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build-debug CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee debug-device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" debug-device.log
      - name: Что попало в архив
        run: |
          A="$RUNNER_TEMP/Albakov.xcarchive"; APP="$A/Products/Applications/Albakov.app"
          {
          echo "== Info.plist архива"; plutil -p "$A/Info.plist"
          echo "== Info.plist приложения"; plutil -p "$APP/Info.plist"
          echo "== Entitlements (подпись ad-hoc; aps-environment=production ставит экспорт для App Store, его здесь нет)"; codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || echo "нет"
          echo "== Архитектуры"; lipo -info "$APP/Albakov"
          echo "== Связанные библиотеки"; otool -L "$APP/Albakov"
          echo "== Слабо связанные"; otool -l "$APP/Albakov" | grep -A2 LC_LOAD_WEAK_DYLIB | grep name || true
          echo "== Файлы приложения"; (cd "$APP" && find . -type f | sort | while read -r f; do printf '%9d %s\n' "$(stat -f %z "$f")" "$f"; done)
          echo "== Размер"; du -sh "$APP"
          echo "== dSYM"; ls "$A/dSYMs" || echo "нет"
          } | tee release-contents.txt
          # Отладочный код в Release. Короткие строки (до 15 байт) Swift кладёт прямо в машинный код — их поиск не видит,
          # поэтому ищем длинные строки, которые есть только в коде под #if DEBUG (Demo, окно «Вышло обновление», журнал разбора),
          # и проверяем сам поиск на сборке Debug: там они обязаны найтись
          MARKS=("подберём по меркам изделия" "Обменять размер можно в личном кабинете" "поддержка с номером обращения и фото" "Не разобран ответ")
          # ищем байты UTF-8 во всех файлах приложения (strings на macOS кириллицу не выводит; код Debug лежит в Albakov.debug.dylib)
          DBGAPP=build-debug/Build/Products/Debug-iphoneos/Albakov.app
          ls "$DBGAPP" | tee -a release-contents.txt
          cnt() { find "$1" -type f -print0 | xargs -0 cat | LC_ALL=C grep -a -c -F "$2" || true; }
          bad=0
          for m in "${MARKS[@]}"; do
            r=$(cnt "$APP" "$m"); d=$(cnt "$DBGAPP" "$m")
            echo "«$m»: Release $r, Debug $d" | tee -a release-contents.txt
            [ "$d" -gt 0 ] || { echo "::error::Контроль не сработал: в Debug нет «$m» — поиск ничего не доказывает"; bad=1; }
            [ "$r" -eq 0 ] || { echo "::error::В Release попал отладочный код: «$m»"; bad=1; }
          done
          exit $bad
      - name: Журналы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check
          path: |
            release.log
            archive.log
            release-contents.txt
            debug-device.log

  screens:
    name: Экраны (симулятор)
    if: github.event_name == 'workflow_dispatch' && (inputs.screens || inputs.store)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Выбрать Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
      - name: Собрать для симулятора
        run: |
          brew install xcodegen && xcodegen generate
          set -o pipefail
          xcodebuild build -project Albakov.xcodeproj -scheme Albakov -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -3
      - name: Снять экраны
        env:
          STORE: ${{ inputs.store }}
          PATHS: ${{ inputs.store_paths }}
          SHOTS: ${{ inputs.screen_paths }}
        run: |
          # App Store: Pro Max (1320×2868 — размер 6,9"); проверка дизайна: обычный Pro
          if [ "$STORE" = "true" ]; then export WANT=Max; else export WANT=; fi
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,os; w=os.environ['WANT']; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone 1' in x['name'] and 'Pro' in x['name'] and (('Max' in x['name']) == (w == 'Max'))))")
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/Albakov.app)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots; i=0
          if [ "$STORE" = "true" ]; then
            # Только экраны покупателя; покупательница вымышленная (demo=buyer), панели управления нет
            # 10 картинок App Store по порядку: главная, товар, таблица размеров товара, корзина, оформление, бонусы, заказ, кабинет, поддержка, сертификаты
            LIST='/ /product/FIRST /product/FIRST?sizes=1&demo=buyer /cart?demo=1 /checkout?demo=1 /account?tab=bonus&demo=buyer /order/d1?demo=buyer /account?demo=buyer /account?tab=support&id=t1&demo=buyer /gift'
            for S in ${PATHS:-$LIST}; do
              i=$((i+1))
              xcrun simctl launch --terminate-running-process "$UDID" ru.albakovofficial.app -screen "$S" -gender men >/dev/null
              sleep 20
              xcrun simctl io "$UDID" screenshot "shots/$(printf %02d $i).png" >/dev/null 2>&1
            done
          else
          # 9–14: кабинет и панель на вымышленных данных (только сборка Debug, боевые заказы не создаются)
          DEFAULT_LIST=(/ /catalog "/catalog?cat=FIRSTCAT" /product/FIRST "/cart?demo=1" "/checkout?demo=1" /account /sizes
                   "/account?demo=staff" "/order/d1?demo=staff" "/account?tab=bonus&demo=staff" "/admin?demo=staff" "/admin?s=orders&demo=staff" "/admin?s=support&id=t1&demo=staff" /gift /track "/admin?s=payment&demo=staff" "/admin?s=finance&demo=staff" "/admin?s=slider&demo=staff" "/admin?s=mail&demo=staff")
          if [ -n "$SHOTS" ]; then read -r -a DEFAULT_LIST <<< "$SHOTS"; fi
          for S in "${DEFAULT_LIST[@]}"; do
            i=$((i+1))
            xcrun simctl launch --terminate-running-process "$UDID" ru.albakovofficial.app -screen "$S" >/dev/null
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$(printf %02d $i).png" >/dev/null 2>&1
          done
          fi
      # Хранилище артефактов GitHub бывает переполнено — кладём снимки в ветку screens этого репозитория
      - name: Сохранить снимки в ветку screens (для App Store — store-shots)
        env:
          STORE: ${{ inputs.store }}
        run: |
          if [ "$STORE" = "true" ]; then B=store-shots; else B=screens; for f in shots/*.png; do sips -Z 1000 "$f" >/dev/null; done; fi
          cd shots && git init -q && git checkout -q -b $B
          git -c user.name=ci -c user.email=ci@albakovofficial.ru add . && git -c user.name=ci -c user.email=ci@albakovofficial.ru commit -qm "Снимки ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" $B

  testflight:
    name: TestFlight
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.testflight)
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить секреты
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Нет секрета $v (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - name: Выбрать Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Создать проект Xcode (XcodeGen)
        run: |
          brew install xcodegen
          TEAM_ID="$APPLE_TEAM_ID" xcodegen generate

      - name: Ключ App Store Connect и номер версии
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#[vV]}"
          else
            VERSION=$(grep -E 'MARKETING_VERSION:' project.yml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD=${{ inputs.build || github.run_number }}" >> "$GITHUB_ENV"
          plutil -replace teamID -string "$APPLE_TEAM_ID" ci/ExportOptions.plist
          echo "Версия $VERSION, сборка ${{ inputs.build || github.run_number }}"

      # Архив подписываем «для себя» (ad-hoc, с нашими entitlements): обычная подпись разработчика требует
      # зарегистрированного iPhone, а для TestFlight она и не нужна. Настоящую подпись App Store ставит экспорт ниже.
      - name: Архив
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Albakov.xcodeproj -scheme Albakov -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Albakov.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_SPECIFIER="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          APPDIR="$RUNNER_TEMP/Albakov.xcarchive/Products/Applications/Albakov.app"
          plutil -extract UIDeviceFamily json -o - "$APPDIR/Info.plist" | grep -qx '\[1\]' || { echo "::error::Сборка не только для iPhone (UIDeviceFamily)"; plutil -p "$APPDIR/Info.plist" | grep -A3 UIDeviceFamily; exit 1; }
          echo "Entitlements архива:"; codesign -d --entitlements - --xml "$RUNNER_TEMP/Albakov.xcarchive/Products/Applications/Albakov.app" | plutil -p - || true

      - name: Подписать для App Store (сертификат и профиль — через ключ API)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Albakov.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee export.log | grep -E "error|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$IPA" -d "$RUNNER_TEMP/ipa"
          APP=$(ls -d "$RUNNER_TEMP"/ipa/Payload/*.app)
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" || true
          codesign -d --entitlements - --xml "$APP" > ent.plist; plutil -p ent.plist
          plutil -extract aps-environment raw ent.plist | grep -q production || { echo "::error::В подписанной сборке нет push (aps-environment=production)"; exit 1; }

      - name: Выгрузить в App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys && cp "$ASC_KEY_PATH" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app -t ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee upload.log
          grep -qiE "UPLOAD SUCCEEDED|No errors uploading" upload.log
          echo "Сборка $VERSION ($BUILD) отправлена. Через 10–30 минут она появится в App Store Connect → TestFlight."

      - name: Логи
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
            upload.log

      - name: Удалить ключ
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8 ~/.appstoreconnect/private_keys/AuthKey_*.p8
